<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RAFT: OCEAN SURVIVORS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#06263a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:none}
canvas#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font:inherit;color:#fff;border:0;cursor:pointer}
img{pointer-events:none;vertical-align:middle}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.glass{background:linear-gradient(160deg,#0f5d86d9,#082f47d9);border:1px solid #ffffff3a;box-shadow:0 4px 14px #0006;backdrop-filter:blur(4px)}
#bars{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));width:158px;padding:8px;border-radius:16px}
.bar{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.bar .tr{flex:1;height:10px;background:#0007;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:6px;transition:width .2s}
#bhp{background:linear-gradient(90deg,#ff5252,#e53935)}#bfood{background:linear-gradient(90deg,#ffb74d,#fb8c00)}#bwater{background:linear-gradient(90deg,#4fc3f7,#0288d1)}
#dayinfo{font-size:11px;opacity:.85;margin-top:2px}
#topbtns{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px}
#topbtns button,#bStation{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center}
#bStation{position:absolute;left:calc(12px + env(safe-area-inset-left));top:calc(118px + env(safe-area-inset-top));width:auto;padding:0 14px;gap:8px;font-weight:700;font-size:13px;height:42px;border-radius:21px;background:linear-gradient(160deg,#ef6c00,#bf360c)}
#acts{position:absolute;right:calc(12px + env(safe-area-inset-right));bottom:calc(92px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.ab{width:68px;height:68px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:linear-gradient(160deg,#1e88e5,#0d47a1);border:2px solid #ffffff66;box-shadow:0 4px 12px #0007;font-weight:800}
.ab small{font-size:10px;letter-spacing:.5px}
#aHook{width:78px;height:78px;background:linear-gradient(160deg,#ff9800,#e65100)}
#aUse{background:linear-gradient(160deg,#43a047,#1b5e20)}
.ab:active{transform:scale(.92);filter:brightness(1.3)}
#aStruggle{width:170px;height:60px;border-radius:30px;font-size:18px;font-weight:900;border:2px solid #fff8;background:linear-gradient(90deg,#ff7043 var(--p,0%),#5d2a1a var(--p,0%));animation:pulse .45s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
#hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:6px;border-radius:18px;background:#041f30cc;border:1px solid #fff3}
.hs{position:relative;width:50px;height:50px;border-radius:12px;background:#0b3a56;border:2px solid #ffffff22;display:flex;align-items:center;justify-content:center}
.hs.on{border-color:#ffd54a;box-shadow:0 0 10px #ffd54a99;background:#14577d}
.hs b{position:absolute;right:3px;bottom:0;font-size:11px;text-shadow:0 1px 2px #000}
.hs.z img{opacity:.35}
#buildchip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));padding:8px 14px;border-radius:16px;display:flex;align-items:center;gap:10px;font-size:13px;white-space:nowrap}
#buildchip small{opacity:.8;display:block}
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);background:#000b;padding:8px 16px;border-radius:20px;font-size:14px;max-width:88vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:30}
#toast.on{opacity:1}
.panel{position:fixed;inset:0;background:#031a2aec;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.card{background:linear-gradient(170deg,#0e4668,#082c44);border:1px solid #ffffff33;border-radius:24px;padding:20px;width:100%;max-width:470px;max-height:92vh;overflow:auto;touch-action:pan-y;box-shadow:0 10px 40px #000a}
.card h1{margin:0;font-size:32px;text-align:center;letter-spacing:3px}
.card h2{margin:0 0 12px;font-size:19px}
.sub{text-align:center;margin:2px 0 14px;opacity:.8;font-size:14px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:linear-gradient(160deg,#1e88e5,#0d47a1);font-weight:700;font-size:16px;margin-top:10px;box-shadow:0 3px 8px #0005}
.btn.g{background:linear-gradient(160deg,#43a047,#1b5e20)}.btn.o{background:linear-gradient(160deg,#ff9800,#e65100)}.btn.r{background:linear-gradient(160deg,#e53935,#8e0000)}.btn.d{background:#37576d}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;margin:0;border-radius:10px}
.btn[disabled]{opacity:.45}
input[type=text],input[type=password]{width:100%;padding:13px;border-radius:12px;border:1px solid #fff4;background:#06263a;color:#fff;font-size:16px;margin-top:8px;user-select:text;-webkit-user-select:text}
label.l{display:block;margin-top:12px;font-size:13px;opacity:.85}
.err{color:#ff8a80;font-size:13px;min-height:18px;margin-top:8px;text-align:center}
.mapi{display:flex;align-items:center;gap:8px;padding:10px;background:#06263a;border-radius:12px;margin-top:6px}
.mapi div{flex:1;font-weight:700}.mapi small{display:block;font-weight:400;opacity:.7}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border-radius:12px;background:#0b3a56;font-weight:700}.tabs button.on{background:#ef6c00}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.cell{position:relative;aspect-ratio:1;border-radius:12px;background:#06263a;border:2px solid #ffffff1a;display:flex;align-items:center;justify-content:center}
.cell.on{border-color:#ffd54a}.cell b{position:absolute;right:5px;bottom:2px;font-size:12px}
.detail{background:#06263a;border-radius:14px;padding:12px;font-size:13px;min-height:84px}.detail h3{margin:0 0 4px;font-size:16px}
.rec{display:flex;align-items:center;gap:10px;background:#06263a;border-radius:12px;padding:10px;margin-top:8px}
.rec .t{flex:1;font-size:12px}.rec .t b{font-size:15px}.rec .t em{font-style:normal;opacity:.7}
.ok{color:#a5d6a7}.no{color:#ef9a9a}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.code{font-size:30px;font-weight:800;letter-spacing:3px;text-align:center;background:#06263a;border-radius:14px;padding:12px;margin:10px 0}
#aimpad{position:absolute;right:calc(104px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:#0a2b4066;border:2px solid #fff6;touch-action:none}
#aimpad:before{content:"NGẮM";position:absolute;left:0;right:0;top:6px;text-align:center;font-size:9px;opacity:.6;letter-spacing:1px}
#aimknob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#ffb74dcc;border:2px solid #fff}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div id="bars" class="glass">
    <div class="bar"><span data-ic="heart" data-s="18"></span><div class="tr"><i id="bhp"></i></div></div>
    <div class="bar"><span data-ic="meat" data-s="18"></span><div class="tr"><i id="bfood"></i></div></div>
    <div class="bar"><span data-ic="drop" data-s="18"></span><div class="tr"><i id="bwater"></i></div></div>
    <div id="dayinfo"></div>
  </div>
  <div id="topbtns">
    <button id="bBag" class="glass" data-ic="bag" data-s="30"></button>
    <button id="bInv" class="glass" data-ic="mail" data-s="30"></button>
    <button id="bMenu" class="glass" data-ic="menu" data-s="28"></button>
  </div>
  <button id="bStation" class="hide"><span data-ic="table" data-s="26"></span>CHẾ TẠO</button>
  <div id="buildchip" class="glass hide"></div>
  <div id="acts">
    <button id="aStruggle" class="hide">VÙNG VẪY!</button>
    <button id="aHook" class="ab"><span data-ic="hook" data-s="34"></span><small>MÓC</small></button>
    <button id="aUse" class="ab"><span id="useIc"></span><small id="useLbl">ĐẤM</small></button>
    <button id="aGrab" class="ab"><span data-ic="hand" data-s="30"></span><small id="grabLbl">KHIÊN</small></button>
  </div>
  <div id="hotbar"></div>
  <div id="aimpad"><i id="aimknob"></i></div>
</div>
<div id="toast"></div>

<div id="menu" class="panel">
  <div class="card">
    <div id="m-main">
      <canvas id="logo" width="240" height="120" style="display:block;margin:0 auto"></canvas>
      <h1>RAFT</h1>
      <p class="sub"><b>OCEAN SURVIVORS</b><br>Sinh tồn trên biển cùng bạn bè</p>
      <button class="btn g" id="goCreate">Tạo map mới</button>
      <button class="btn" id="goJoin">Vào map</button>
      <label class="l">Server online (Render) — để trống = chơi offline</label>
      <input type="text" id="srvUrl" placeholder="https://ten-app.onrender.com" autocomplete="off">
    </div>
    <div id="m-create" class="hide">
      <h2>Tạo map mới</h2>
      <label class="l">Tên map</label>
      <input type="text" id="cName" maxlength="20" placeholder="vd: BeCuaTui" autocomplete="off">
      <label class="l">Mật khẩu map (để vào map)</label>
      <input type="password" id="cPass" maxlength="20" placeholder="ít nhất 3 ký tự" autocomplete="off">
      <div class="err" id="cErr"></div>
      <button class="btn g" id="doCreate">Tạo & chơi</button>
      <button class="btn d" data-back>Quay lại</button>
    </div>
    <div id="m-join" class="hide">
      <h2>Vào map</h2>
      <label class="l">Tên map hoặc mã mời</label>
      <input type="text" id="jName" maxlength="20" placeholder="Tên map / RAFT-XXXX" autocomplete="off">
      <label class="l">Mật khẩu map</label>
      <input type="password" id="jPass" maxlength="20" autocomplete="off">
      <div class="err" id="jErr"></div>
      <button class="btn" id="doJoin">Vào map</button>
      <div id="mapList"></div>
      <button class="btn d" data-back>Quay lại</button>
    </div>
  </div>
</div>

<div id="bag" class="panel hide">
  <div class="card">
    <div id="bagBody"></div>
    <button class="btn d" id="bagClose">Đóng</button>
  </div>
</div>

<div id="invite" class="panel hide">
  <div class="card">
    <h2>Mời bạn vào map</h2>
    <div style="font-size:14px;opacity:.85">Map: <b id="invName"></b></div>
    <div class="code" id="invCode">RAFT-0000</div>
    <div style="font-size:13px;opacity:.8">Bạn bè nhập <b>mã này + mật khẩu map</b> ở mục “Vào map”. Cả hai nhập cùng địa chỉ server online (ở menu chính) để thấy nhau trên bè.</div>
    <button class="btn sm" id="invCopy" style="margin-top:10px">Sao chép mã</button>
    <button class="btn d" id="invClose">Đóng</button>
  </div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const T=48;
let W=0,H=0,DPR=1,Z=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;Z=Math.max(.7,Math.min(1.5,Math.min(W,H)/460));}
addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return (h^(h>>>16))>>>0}
function hstr(s){let x=5381;for(let i=0;i<s.length;i++)x=((x*33)^s.charCodeAt(i))>>>0;return x.toString(36)}

/* ================= DATA ================= */
const IT={
  wood:['Gỗ','mat','Nguyên liệu cơ bản để xây và chế đồ.'],
  plastic:['Nhựa','mat','Nhặt từ rác trôi trên biển.'],
  leaf:['Lá cọ','mat','Bện thành dây thừng.'],
  scrap:['Phế liệu','mat','Kim loại gỉ, dùng chế công cụ.'],
  rope:['Dây thừng','mat','Bện từ lá cọ.'],
  fish:['Cá sống','food','Ăn sống: +12 no. Nướng ngon hơn.'],
  grilled:['Cá nướng','food','+45 no.'],
  can:['Đồ hộp','food','+30 no.'],
  coconut:['Dừa','food','+12 no, +18 nước.'],
  water:['Nước sạch','drink','+45 nước.'],
  hammer:['Búa','tool','Cầm búa rồi bấm XÂY: đặt ô bè, bàn chế tạo, bếp.'],
  hook2:['Móc sắt','gear','Móc xa 460 (móc thường 300). Tự dùng khi có.'],
  spear:['Giáo','weapon','Sát thương 2, tầm đánh xa.'],
  sword:['Kiếm sắt','weapon','Sát thương 3, đánh nhanh.'],
  shield:['Khiên gỗ','gear','Giảm 50% sát thương cá mập cắn bạn.']
};
const ORDER=Object.keys(IT);
const USE={fish:{f:12},grilled:{f:45},can:{f:30},coconut:{f:12,w:18},water:{w:45}};
const WEAP={spear:{d:2,r:90,cd:.5},sword:{d:3,r:66,cd:.4},fist:{d:1,r:48,cd:.45}};
const REC=[
  {id:'hammer',st:'hand',need:{wood:3,plastic:1},out:'hammer',once:1},
  {id:'rope',st:'hand',need:{leaf:3},out:'rope'},
  {id:'hook2',st:'table',need:{scrap:2,rope:1,wood:1},out:'hook2',once:1},
  {id:'spear',st:'table',need:{wood:2,scrap:1},out:'spear',once:1},
  {id:'sword',st:'table',need:{wood:1,scrap:4,rope:1},out:'sword',once:1},
  {id:'shield',st:'table',need:{wood:4,rope:2,scrap:1},out:'shield',once:1},
  {id:'grilled',st:'grill',need:{fish:1,wood:1},out:'grilled'},
  {id:'water',st:'grill',need:{plastic:2,leaf:1},out:'water'}
];
const STN={hand:'Làm bằng tay',table:'Cần bàn chế tạo',grill:'Cần bếp nướng'};
const BUILD=[
  {id:'tile',n:'Ô bè',need:{wood:2,plastic:1}},
  {id:'table',n:'Bàn chế tạo',need:{wood:6,scrap:3,rope:1}},
  {id:'grill',n:'Bếp nướng',need:{wood:4,scrap:2}},
  {id:'purifier',n:'Giàn lọc nước (+1 nước/40s)',need:{wood:5,plastic:4,scrap:2,rope:1},tb:1},
  {id:'garden',n:'Vườn dừa (+1 dừa/55s)',need:{wood:4,leaf:4,coconut:1},tb:1},
  {id:'net',n:'Lưới vớt đồ (tự vớt đồ trôi/25s)',need:{rope:3,wood:3,scrap:2},tb:1}
];
const PASS={purifier:[40,()=>add('water',1)],garden:[55,()=>add('coconut',1)],net:[25,()=>collect({k:pickW(FLOAT_W)})]};
const FLOAT_W=[['wood',30],['plastic',20],['leaf',20],['scrap',12],['barrel',11],['coconut',7]];
const LOOT_W=[['wood',20],['plastic',16],['scrap',14],['can',12],['water',10],['rope',8],['coconut',8],['leaf',12]];
function pickW(t){let s=0;t.forEach(a=>s+=a[1]);let r=Math.random()*s;for(const a of t){r-=a[1];if(r<=0)return a[0]}return t[0][0]}
const BOTS=[
  {name:'Bông',shirt:'#e53935',hat:'cap',hc:'#b71c1c',skin:'#f1c27d'},
  {name:'Tí',shirt:'#8e24aa',hat:'beanie',hc:'#ffca28',skin:'#d9a066'},
  {name:'Mít',shirt:'#43a047',hat:'hood',hc:'#2e7d32',skin:'#f6d3a6'},
  {name:'Sóc',shirt:'#fb8c00',hat:'none',hc:'#4e342e',skin:'#c68642'}
];
const ME={shirt:'#1e88e5',hat:'straw',hc:'#e6c36a',skin:'#f1c27d'};

/* ================= ICONS (tự vẽ) ================= */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawIcon(c,k,x,y,s){
  c.save();c.translate(x,y);c.scale(s/32,s/32);c.lineWidth=2;c.lineJoin='round';c.lineCap='round';
  const F=col=>{c.fillStyle=col;c.fill()},S=col=>{c.strokeStyle=col;c.stroke()};
  const FS=(a,b)=>{F(a);S(b)};
  switch(k){
  case 'wood':rr(c,-14,-7,28,14,5);FS('#9c6b3c','#5c3a1e');c.beginPath();c.ellipse(-11,0,4,6,0,0,6.3);FS('#e0b274','#5c3a1e');c.beginPath();c.moveTo(-4,-3);c.lineTo(10,-3);c.moveTo(-2,3);c.lineTo(8,3);S('#6f4726');break;
  case 'plastic':rr(c,-6,-9,12,21,4);FS('#b3e5fc','#4fc3f7');rr(c,-3,-14,6,5,1);FS('#e53935','#8e0000');c.beginPath();c.moveTo(-6,-2);c.lineTo(6,-2);S('#4fc3f7');break;
  case 'leaf':c.beginPath();c.moveTo(-12,11);c.quadraticCurveTo(-15,-12,12,-12);c.quadraticCurveTo(14,13,-12,11);FS('#43a047','#1b5e20');c.beginPath();c.moveTo(-11,10);c.lineTo(8,-8);S('#a5d6a7');break;
  case 'scrap':for(let i=0;i<8;i++){c.save();c.rotate(i*Math.PI/4);rr(c,-3,-14,6,8,1);F('#90a4ae');c.restore()}c.beginPath();c.arc(0,0,10,0,6.3);FS('#78909c','#455a64');c.beginPath();c.arc(0,0,4,0,6.3);F('#37474f');break;
  case 'rope':c.lineWidth=4;c.strokeStyle='#c8a165';c.beginPath();c.arc(0,0,11,0,6.3);c.stroke();c.beginPath();c.arc(0,0,5,0,6.3);c.stroke();c.beginPath();c.moveTo(9,8);c.lineTo(15,13);c.stroke();break;
  case 'fish':case 'grilled':{const g=k==='grilled';c.beginPath();c.moveTo(10,0);c.lineTo(17,-7);c.lineTo(17,7);c.closePath();FS(g?'#c26a2b':'#607d8b','#263238');c.beginPath();c.ellipse(-2,0,13,7,0,0,6.3);FS(g?'#d98a45':'#90a4ae','#263238');
    if(g){c.beginPath();for(let i=-6;i<=6;i+=4){c.moveTo(i,-5);c.lineTo(i+2,5)}S('#6d3b12')}else{c.beginPath();c.arc(-8,-2,1.8,0,6.3);F('#fff');c.beginPath();c.arc(-8,-2,.8,0,6.3);F('#000')}break}
  case 'can':rr(c,-9,-11,18,22,3);FS('#b0bec5','#546e7a');c.beginPath();c.rect(-9,-4,18,9);FS('#e53935','#8e0000');c.beginPath();c.moveTo(-9,-8);c.lineTo(9,-8);S('#eceff1');break;
  case 'water':rr(c,-7,-9,14,23,5);FS('#e1f5fe','#4fc3f7');rr(c,-6,0,12,13,4);F('#29b6f6');rr(c,-3,-14,6,5,1);FS('#1565c0','#0d47a1');break;
  case 'coconut':c.beginPath();c.arc(0,0,12,0,6.3);FS('#6d4c41','#3e2723');c.beginPath();c.arc(-3,-3,1.8,0,6.3);c.arc(3,-3,1.8,0,6.3);c.arc(0,2,1.8,0,6.3);F('#2b1a14');c.beginPath();c.arc(-5,-6,3,3.3,4.7);S('#a1887f');break;

  S=JSON.parse(JSON.stringify(rec.data));

  if(S.hookLv>1&&!S.inv.hook2)S.inv.hook2=1;if(S.spear&&!S.inv.spear)S.inv.spear=1;delete S.inv.plank;
  tm=new Map();S.tiles.forEach(t=>tm.set(tkey(t[0],t[1]),{i:t[0],j:t[1],hp:t[2],obj:t[3]||null}));

  aim={x:1,y:0};cam.x=P.x;cam.y=P.y;spawnT=1;sharkT=0;paused=false;running=true;hotSig='';

function calcRC(){let x=0,y=0,n=0;tm.forEach(t=>{x+=(t.i+.5)*T;y+=(t.j+.5)*T;n++});if(n){RC.x=x/n;RC.y=y/n}}
function persist(){
  if(!S||!running)return;
  S.tiles=[...tm.values()].map(t=>[t.i,t.j,t.hp,t.obj]);
  S.p={x:P.x,y:P.y,hp:P.hp,food:P.food,water:P.water};
  S.friends=friends.map(f=>({name:f.name}));

}

function consume(k){
  const d=USE[k];if(!d||cnt(k)<1)return;takeInv(k,1);
  if(d.f)P.food=Math.min(100,P.food+d.f);if(d.w)P.water=Math.min(100,P.water+d.w);
  ftext(P.x,P.y-34,IT[k][0]+'!');
}
function renderBag(){
  let h=`<div class="tabs"><button data-tab="inv" class="${bagTab==='inv'?'on':''}">Túi đồ</button><button data-tab="craft" class="${bagTab==='craft'?'on':''}">Chế tạo</button></div>`;
  if(bagTab==='inv'){
    const ks=ORDER.filter(k=>cnt(k)>0);
    if(!ks.length)h+='<div class="detail">Túi trống — hãy móc đồ trôi trên biển!</div>';
    else{
      h+='<div class="grid">'+ks.map(k=>`<div class="cell${bagSel===k?' on':''}" data-sel="${k}">${ic(k,38)}<b>${cnt(k)}</b></div>`).join('')+'</div>';
      const k=bagSel&&cnt(bagSel)>0?bagSel:null;
      if(k){
        h+=`<div class="detail"><h3>${IT[k][0]}</h3>${IT[k][2]}<div class="row">`;
        if(USE[k])h+=`<button class="btn sm g" data-use="${k}">Dùng</button>`;
        if(HOLDABLE.includes(IT[k][1]))h+=`<button class="btn sm o" data-hold="${k}">Cầm vào ô ${S.sel+1}</button>`;
        h+='</div></div>';
      }else h+='<div class="detail">Chạm một món để xem chi tiết.</div>';
    }
  }else{
    const nt=near('table'),ng=near('grill');
    h+=`<div style="font-size:12px;opacity:.9;margin-bottom:6px">Bàn chế tạo: <b class="${nt?'ok':'no'}">${nt?'ở gần':'chưa ở gần'}</b> • Bếp nướng: <b class="${ng?'ok':'no'}">${ng?'ở gần':'chưa ở gần'}</b></div>`;
    REC.forEach(r=>{
      const done=r.once&&cnt(r.out)>0;
      const mats=Object.keys(r.need).every(k=>cnt(k)>=r.need[k]);
      const stOK=r.st==='hand'||(r.st==='table'?nt:ng);
      const can=!done&&mats&&stOK;
      const need=Object.keys(r.need).map(k=>`<span class="${cnt(k)>=r.need[k]?'ok':'no'}">${ic(k,16)}${r.need[k]}</span>`).join(' ');
      h+=`<div class="rec">${ic(r.out,40)}<div class="t"><b>${IT[r.out][0]}</b><br>${need}<br><em>${done?'Đã có':STN[r.st]}</em></div><button class="btn sm ${can?'o':'d'}" data-craft="${r.id}" ${can?'':'disabled'}>Chế</button></div>`;
    });
  }
  $('bagBody').innerHTML=h;
}
$('bagBody').onclick=e=>{

function launch(e,dir,speed,dur){e.state='flying';e.flight={t:0,dur,vx:dir.x*speed,vy:dir.y*speed}}
function flyUpd(e,dt){
  const f=e.flight;f.t+=dt;e.x+=f.vx*dt;e.y+=f.vy*dt;
  const u=Math.min(1,f.t/f.dur);e.z=Math.sin(u*Math.PI)*55;
  if(f.t>=f.dur){e.z=0;e.flight=null;e.state='free';if(!tileAt(e.x,e.y))splash(e)}
}
function actHook(){

}
function actGrab(){
  if(!running||paused||P.state!=='free')return;
  if(P.carrying){const f=P.carrying;P.carrying=null;f.carriedBy=null;launch(f,aim,330,.7);return}
  let best=null,bd=64;
  friends.forEach(f=>{if(f.state==='free'&&f.mode!=='carryP'){const d=dist(P,f);if(d<bd){bd=d;best=f}}});
  if(!best)return toast('Lại gần bạn online để khiên');

function attack(w){

  });

function buildCell(){return {ci:Math.floor((P.x+aim.x*T*.9)/T),cj:Math.floor((P.y+aim.y*T*.9)/T)}}

/* ================= UPDATE ================= */
const angDiff=(b,a)=>((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
function updPlayer(dt){
  P.atkCd-=dt;P.mv=false;
  if(P.state==='flying'){flyUpd(P,dt);return}
  if(P.state==='carried'){
    const b=P.carriedBy;P.x=b.x;P.y=b.y;P.z=34;P.str=Math.max(0,P.str-.22*dt);
    if(P.str>=1){
      P.state='free';P.carriedBy=null;P.z=0;P.str=0;
      P.x=b.x+b.dir.x*30;P.y=b.y+b.dir.y*30;
      b.mode='wander';b.cool=rand(25,40);b.stun=1.2;b.tgt=null;
      toast('Bạn vùng thoát và rơi xuống!');if(!tileAt(P.x,P.y))splash(P);
    }
    return;
  }
  let mx=0,my=0;
  if(mj){const dx=mj.x-mj.ox,dy=mj.y-mj.oy,d=Math.hypot(dx,dy),m=Math.min(1,d/50);if(d>6){mx=dx/d*m;my=dy/d*m}}
  if(keys.a||keys.arrowleft)mx-=1;if(keys.d||keys.arrowright)mx+=1;if(keys.w||keys.arrowup)my-=1;if(keys.s||keys.arrowdown)my+=1;
  const len=Math.hypot(mx,my),inW=!tileAt(P.x,P.y);
  if(len>.1){
    if(len>1){mx/=len;my/=len}
    let sp=inW?85:150;if(P.carrying)sp*=.7;
    P.x+=mx*sp*dt;P.y+=my*sp*dt;P.mv=true;P.walk+=dt*11;
  }
  if(inW){P.x-=30*dt;
    items.forEach(it=>{if(!it.hooked&&dist(P,it)<24){it.taken=true;collect(it)}});
    items=items.filter(i=>!i.taken);
  }
}
function collect(it){
  if(it.k==='barrel'){
    const n=2+Math.floor(Math.random()*2);let s='Thùng đồ: ';
    for(let i=0;i<n;i++){const k=pickW(LOOT_W);addInv(k,1);s+=IT[k][0]+(i<n-1?', ':'')}
    toast(s,2800);

}
function updHook(dt){
  if(!hook)return;
  if(P.state!=='free'){if(hook.it)hook.it.hooked=false;hook=null;return}
  if(hook.state==='out'){
    const st=560*dt;hook.x+=hook.dx*st;hook.y+=hook.dy*st;hook.d+=st;
    for(const it of items){if(!it.hooked&&dist(hook,it)<26){it.hooked=true;hook.it=it;hook.state='back';break}}
    for(const p of (typeof net!=='undefined'?net.peers:[])){if(p.cs==='free'&&!tileAt(p.x,p.y)&&dist(hook,p)<32){E('pull',{to:p.id,x:P.x,y:P.y});toast('Móc '+p.name+' về bè!');hook.state='back';break}}
    if(hook.d>=hookRange())hook.state='back';
  }else{
    const dx=P.x-hook.x,dy=P.y-hook.y,d=Math.hypot(dx,dy);
    if(d<22){
      if(hook.it){const it=hook.it;it.taken=true;collect(it);items=items.filter(i=>!i.taken)}
      hook=null;return;
    }
    const st=Math.min(d,520*dt);hook.x+=dx/d*st;hook.y+=dy/d*st;
    if(hook.it){hook.it.x=hook.x;hook.it.y=hook.y}
  }
}
function updFriend(f,dt){
  f.stun-=dt;f.mv=false;
  if(f.state==='flying'){flyUpd(f,dt);return}
  if(f.state==='carried'){
    f.x=P.x;f.y=P.y;f.z=34;f.sT-=dt;
    if(f.sT<=0){f.sT=rand(.5,1.4);f.str+=rand(.12,.3)}
    f.str=Math.max(0,f.str-.05*dt);
    if(f.str>=1){
      P.carrying=null;f.carriedBy=null;f.state='free';f.z=0;f.str=0;f.stun=1.2;
      f.x=P.x+aim.x*30;f.y=P.y+aim.y*30;toast(f.name+' vùng vẫy thoát!');
      if(!tileAt(f.x,f.y))splash(f);
    }
    return;
  }
  f.cool-=dt;
  const inW=!tileAt(f.x,f.y);
  const move=(tx,ty,sp)=>{const dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy);if(d>1){const s=Math.min(d,sp*dt);f.x+=dx/d*s;f.y+=dy/d*s;f.dir={x:dx/d,y:dy/d};f.mv=true;f.walk+=dt*10}return d};
  if(inW){const c=nearestTileCenter(f);if(c)move(c.x,c.y,90);f.x-=30*dt;return}
  if(f.stun>0)return;
  if(f.mode==='carryP'){
    f.chT+=dt;const d=move(f.tgt.x,f.tgt.y,80);P.x=f.x;P.y=f.y;
    if(d<6||f.chT>8){
      const dir=f.tgt.dir;P.carriedBy=null;P.z=0;P.str=0;P.state='free';
      launch(P,dir,330,.7);f.mode='wander';f.cool=rand(25,45);f.stun=.8;f.tgt=null;
      toast(f.name+' quăng bạn xuống biển!');
    }
    return;
  }
  if(f.mode==='chase'){
    f.chT+=dt;
    if(P.state!=='free'||P.carrying||!tileAt(P.x,P.y)||f.chT>9){f.mode='wander';f.cool=rand(10,20);return}
    const d=move(P.x,P.y,115);
    if(d<34){
      hook=null;
      let b=null,bd=1e9;edgeList().forEach(e=>{const dd=Math.hypot(e.cx-f.x,e.cy-f.y);if(dd<bd){bd=dd;b=e}});
      if(!b){f.mode='wander';return}
      f.tgt={x:b.cx+b.dx*T*.4,y:b.cy+b.dy*T*.4,dir:{x:b.dx,y:b.dy}};
      f.mode='carryP';f.chT=0;P.state='carried';P.carriedBy=f;P.str=0;
      toast(f.name+' khiên bạn! Bấm VÙNG VẪY liên tục!',2600);
    }
    return;
  }
  if(S.naughty&&f.cool<=0&&P.state==='free'&&!P.carrying&&tileAt(P.x,P.y)){f.mode='chase';f.chT=0;toast(f.name+' đang rình bạn...');return}
  f.wt-=dt;
  if(f.tx===null||(f.wt<=0&&dist(f,{x:f.tx,y:f.ty})<8)){
    const tl=[...tm.values()].filter(t=>!t.obj);const t=tl[Math.floor(Math.random()*tl.length)]||{i:0,j:0};
    f.tx=(t.i+.5)*T+rand(-12,12);f.ty=(t.j+.5)*T+rand(-12,12);f.wt=rand(1.5,3.5);
  }
  if(dist(f,{x:f.tx,y:f.ty})>6)move(f.tx,f.ty,60);
}

/* ---- cá mập: bơi dưới biển, lượn quanh bè, thỉnh thoảng lao vào cắn ---- */
function mkShark(a){return {x:RC.x+Math.cos(a)*300,y:RC.y+Math.sin(a)*300,hp:8,mhp:8,st:'circle',a,r:rand(230,320),dir:Math.random()<.5?1:-1,atk:rand(30,55),bt:0,flash:0,ang:0,surf:0,n:0,tt:null,life:0}}
function updShark(s,dt){
  s.flash-=dt;s.bt-=dt;s.atk-=dt;s.life+=dt;
  const mv=(tx,ty,sp)=>{const dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy)||1,st=Math.min(d,sp*dt);s.x+=dx/d*st;s.y+=dy/d*st;if(d>2)s.ang+=angDiff(Math.atan2(dy,dx),s.ang)*Math.min(1,dt*4);return d};
  let tg=null,td=300;
  [P,...friends].forEach(e=>{if(e.state==='free'&&!tileAt(e.x,e.y)){const d=dist(s,e);if(d<td){td=d;tg=e}}});
  if(tg){
    s.st='hunt';s.surf=1;const d=mv(tg.x,tg.y,135);
    if(d<30&&s.bt<=0){s.bt=1.4;ftext(tg.x,tg.y-24,'Cắn!');if(tg===P){P.hp-=cnt('shield')?7:14;toast('Cá mập cắn bạn! Lên bè mau!',1500)}}
    return;
  }
  if(s.st==='hunt'){s.st='circle';s.atk=rand(15,30)}
  if(s.st==='raid'){
    s.surf=1;const t=s.tt;
    if(!t||!tm.has(tkey(t.i,t.j))){s.st='circle';s.atk=rand(25,45);return}
    const cx=(t.i+.5)*T,cy=(t.j+.5)*T,d=mv(cx,cy,95);
    if(d<T*.95&&s.bt<=0){
      s.bt=2.2;s.n++;t.hp-=1;ftext(cx,cy-10,'Rắc!');
      if(t.hp<=0){if(tm.size>1){tm.delete(tkey(t.i,t.j));calcRC();toast('Cá mập cắn mất 1 ô bè!')}else t.hp=1}
      if(s.n>=3){s.st='circle';s.atk=rand(35,60)}
    }
    return;
  }
  s.surf=Math.max(0,s.surf-dt*.8);s.a+=s.dir*.32*dt;
  mv(RC.x+Math.cos(s.a)*s.r,RC.y+Math.sin(s.a)*s.r,110);
  if(s.atk<=0){
    let b=null,bd=1e9;edgeList().forEach(e=>{const d=Math.hypot(e.cx-s.x,e.cy-s.y);if(d<bd){bd=d;b=e}});
    if(b){s.st='raid';s.tt=b.t;s.n=0;toast('Cá mập đang lao vào bè!')}else s.atk=20;
  }
}
let sharkWait=false;
function update(dt){
  S.t+=dt;
  updPlayer(dt);updHook(dt);
  friends.forEach(f=>updFriend(f,dt));
  if(swing){swing.t+=dt;if(swing.t>.22)swing=null}
  tm.forEach(t=>{const p=PASS[t.obj];if(!p)return;t.pt=(t.pt||0)+dt;if(t.pt>=p[0]){t.pt=0;p[1]()}});
  spawnT-=dt;
  if(spawnT<=0){spawnT=rand(1,2.2);items.push({k:pickW(FLOAT_W),x:P.x+W/Z*.6+50,y:P.y+rand(-H/Z/2,H/Z/2),ph:rand(0,6.28),hooked:false})}
  items.forEach(it=>{if(!it.hooked){it.x-=34*dt;it.y+=Math.sin(S.t*1.2+it.ph)*8*dt}});
  items=items.filter(it=>it.hooked||(it.x>P.x-W/Z/2-200&&Math.abs(it.y-P.y)<H/Z+200));
  if(items.length>40)items.splice(0,items.length-40);
  const want=S.t>=480?3:2;
  if(sharks.length<want){
    if(!sharkWait){sharkT=rand(40,60);sharkWait=true}
    sharkT-=dt;if(sharkT<=0){sharks.push(mkShark(rand(0,6.28)));sharkWait=false}
  }else sharkWait=false;
  sharks.forEach(s=>updShark(s,dt));
  texts.forEach(t=>{t.t+=dt;t.y-=28*dt});texts=texts.filter(t=>t.t<1.2);
  P.food=Math.max(0,P.food-.33*dt);P.water=Math.max(0,P.water-.45*dt);
  if(P.food<=0||P.water<=0)P.hp-=2*dt;
  else if(P.food>50&&P.water>50&&tileAt(P.x,P.y))P.hp=Math.min(100,P.hp+dt);
  if(P.hp<=0)die();
  saveT+=dt;if(saveT>5){saveT=0;persist()}
  cam.x+=(P.x-cam.x)*Math.min(1,dt*6);cam.y+=(P.y-cam.y)*Math.min(1,dt*6);
  hudT+=dt;if(hudT>.1){hudT=0;updHud()}
}

  ctx.fillStyle=st.shirt;rr(ctx,x-8,yy-6,16,17,5);ctx.fill();
  ctx.fillStyle=st.skin;ctx.beginPath();ctx.arc(x,yy-12,8,0,6.3);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(x-4,yy-13,2,3);ctx.fillRect(x+2,yy-13,2,3);
  ctx.fillStyle=st.hc;
  if(st.hat==='straw'){ctx.beginPath();ctx.ellipse(x,yy-17,14,4,0,0,6.3);ctx.fill();ctx.beginPath();ctx.arc(x,yy-18,7,Math.PI,0);ctx.fill()}
  else if(st.hat==='cap'){ctx.beginPath();ctx.arc(x,yy-15,8,Math.PI,0);ctx.fill();ctx.fillRect(x,yy-16,12,3)}
  else if(st.hat==='beanie'){ctx.beginPath();ctx.arc(x,yy-15,8.5,Math.PI,0);ctx.fill();ctx.beginPath();ctx.arc(x,yy-24,2.5,0,6.3);ctx.fill()}
  else if(st.hat==='hood'){ctx.beginPath();ctx.arc(x,yy-13,9.5,Math.PI*1.05,Math.PI*1.95);ctx.lineWidth=3;ctx.strokeStyle=st.hc;ctx.stroke()}
  else{ctx.fillRect(x-8,yy-19,16,4)}
  if(label){ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#0008';ctx.lineWidth=3;ctx.strokeText(label,x,yy-28);ctx.fillText(label,x,yy-28)}
}
function drawShark(s){

    ctx.fillStyle=s.flash>0?'#fff':'#607d8b';ctx.beginPath();ctx.ellipse(0,0,30,11,0,0,6.3);ctx.fill();
    ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(-42,-12);ctx.lineTo(-42,12);ctx.closePath();ctx.fill();
    ctx.fillStyle='#b0bec5';ctx.beginPath();ctx.ellipse(6,3,18,5,0,0,6.3);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(18,-4,2,0,6.3);ctx.fill();
  }
  ctx.fillStyle=s.flash>0?'#fff':'#455a64';ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-14,-16);ctx.lineTo(8,0);ctx.closePath();ctx.fill();
  ctx.restore();

}
function drawTile(t){

function drawOcean(tt){

    const h=hash(Math.floor(x/60),Math.floor(y/40)),ox=(h%30),oy=((h>>5)%20),w=Math.sin(tt*1.5+h)*3;

  sharks.forEach(drawShark);
  const ents=[{e:P,st:ME,l:''},...friends.map(f=>({e:f,st:f.st,l:f.name})),...net.peers.map(p=>({e:p,st:ME2(p),l:p.name}))];

  if(swing){const u=swing.t/.22;ctx.strokeStyle='#fff';ctx.globalAlpha=1-u;ctx.lineWidth=4;ctx.beginPath();ctx.arc(P.x,P.y-4,swing.r*.8,swing.a-.9+u*1.2,swing.a-.2+u*1.2);ctx.stroke();ctx.globalAlpha=1}
  if(P.state==='free'){ctx.strokeStyle=hookDrag?'#ffb74dcc':'#ffffff77';ctx.lineWidth=2;ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(P.x+aim.x*20,P.y+aim.y*20);ctx.lineTo(P.x+aim.x*(hookDrag?hookRange():56),P.y+aim.y*(hookDrag?hookRange():56));ctx.stroke();ctx.setLineDash([])}
  ctx.font='bold 15px system-ui';ctx.textAlign='center';
  texts.forEach(t=>{ctx.globalAlpha=Math.max(0,1-t.t/1.2);ctx.fillStyle='#fff';ctx.strokeStyle='#000a';ctx.lineWidth=3;ctx.strokeText(t.m,t.x,t.y);ctx.fillText(t.m,t.x,t.y)});
  ctx.globalAlpha=1;
  // ban đêm
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const ph=(S.t%240)/240,nt=ph>.65?Math.min(1,(ph-.65)/.1)*(ph>.92?Math.max(0,(1-ph)/.08):1):0;
  if(nt>0){ctx.fillStyle='rgba(5,15,50,'+(.5*nt)+')';ctx.fillRect(0,0,W,H)}
  // joystick
  [[mj,'#fff'],[aj,'#ffb74d']].forEach(([j,c])=>{if(!j)return;ctx.strokeStyle=c+'88';ctx.lineWidth=3;ctx.beginPath();ctx.arc(j.ox,j.oy,50,0,6.3);ctx.stroke();ctx.fillStyle=c+'66';const d=Math.hypot(j.x-j.ox,j.y-j.oy)||1,m=Math.min(50,d);ctx.beginPath();ctx.arc(j.ox+(j.x-j.ox)/d*m,j.oy+(j.y-j.oy)/d*m,22,0,6.3);ctx.fill()});
  if(P.hp<35){ctx.fillStyle='rgba(200,0,0,'+(.18+.1*Math.sin(now*6))+')';ctx.fillRect(0,0,W,H)}
}

let net={code:null,room:null,peers:[],id:Math.random().toString(36).slice(2,8),pT:0,tT:0,tries:0};
const NETCOL=['#00acc1','#ec407a','#7e57c2','#26a69a','#ff7043','#9ccc65'];
function srvBase(){let s='';try{s=(localStorage.getItem('raft_server')||'').trim()}catch(e){}
  if(!s&&/^https?:/.test(location.protocol)&&/onrender\.com|localhost|127\./.test(location.host))s=location.origin;
  if(!s)return '';if(!/^(https?|wss?):/.test(s))s='https://'+s;return s.replace(/^ws/,'http').replace(/\/$/,'')}
function wsRoom(url){return {join(name){
  const L={topics:{}};let ws=null,dead=false;
  const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
  const open=()=>{if(dead)return;ws=new WebSocket(url);
    ws.onopen=()=>ws.send(JSON.stringify({t:'join',room:name,id:net.id}));
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
      if(m.t==='peers'&&L.pf)L.pf(m.list);else if(m.t==='emit'&&L.topics[m.topic])L.topics[m.topic](m.data)};
    ws.onclose=()=>{if(!dead)setTimeout(open,2000)}};
  open();
  return {onPeers:f=>{L.pf=f},on:(t,f)=>{L.topics[t]=f},emit:(t,d)=>send({t:'emit',topic:t,data:d}),presence:p=>send({t:'pres',s:p}),leave:()=>{dead=true;try{ws.close()}catch(_){}}}}}}
async function getRoomAPI(){const b=srvBase();if(b)return wsRoom(b.replace(/^http/,'ws'));if(window.claude&&claude.use)return claude.use('room');return null}
async function goOnline(){
  net.code=S.code;net.room=null;net.peers=[];
  try{
    
    const R=await getRoomAPI();if(!R)return;
    const r=R.join?await R.join('raft-'+S.code.toLowerCase()):R;if(!r)return;
    r.onPeers(list=>{
      const arr=Array.isArray(list)?list:Object.values(list||{});
      net.peers=arr.map(p=>p&&(p.state||p.presence||p)).filter(s=>s&&s.id&&s.id!==net.id&&typeof s.x==='number').map(s=>({...s,z:0,mv:true,walk:performance.now()/90}));
      if(net.peers.length&&running&&!net.toasted){net.toasted=1;toast('Bạn bè online đã vào bè!')}
    });
    r.on('tiles',m=>{
      m=m&&m.data?m.data:m;if(!m||m.id===net.id||!Array.isArray(m.tiles)||!running)return;
      let ch=false;m.tiles.forEach(t=>{const k=tkey(t[0],t[1]);if(!tm.has(k)){tm.set(k,{i:t[0],j:t[1],hp:t[2],obj:t[3]||null});ch=true}else{const o=tm.get(k);if(!o.obj&&t[3]){o.obj=t[3];ch=true}}});
      if(ch){calcRC();persist()}
    });
    net.room=r;toast('Đã kết nối online • mã '+S.code,2600);
  }catch(e){net.room=null}
}
function netTick(dt){

    if(net.pT<=0){net.pT=.2;r.presence({id:net.id,x:Math.round(P.x),y:Math.round(P.y),z:Math.round(P.z||0),name:'Bạn '+net.id.slice(0,2).toUpperCase(),shirt:NETCOL[parseInt(net.id,36)%NETCOL.length],hat:'straw',dx:aim.x,dy:aim.y,cs:P.state,hp:Math.round(P.hp)})}
    if(net.tT<=0){net.tT=4;r.emit('tiles',{id:net.id,tiles:[...tm.values()].map(t=>[t.i,t.j,t.hp,t.obj])})}

}

  if(online()){s.flash-=dt;s.x+=(s.tx-s.x)*Math.min(1,dt*8);s.y+=(s.ty-s.y)*Math.min(1,dt*8);return}

};

    net.sT=.2;const m={id:net.id,s:sharks.map(s=>[Math.round(s.x),Math.round(s.y),+s.ang.toFixed(2),+s.surf.toFixed(1),s.hp,s.st]),
      it:items.filter(i=>!i.hooked).map(i=>[i.k,Math.round(i.x),Math.round(i.y),+i.ph.toFixed(1)])};
    if(net.tlT<=0){net.tlT=1;m.tl=[...tm.values()].map(t=>[t.i,t.j,t.hp,t.obj])}
    E('snap',m);
  }
};
